<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Income Expense Calculator</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            .transaction-list::-webkit-scrollbar {
                width: 6px;
            }

            .transaction-list::-webkit-scrollbar-track {
                background: #f1f1f1;
            }

            .transaction-list::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 4px;
            }
        </style>
    </head>

    <body class="bg-gray-100 min-h-screen font-sans text-gray-800 p-4">

        <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">

            <div class="bg-slate-800 p-6 text-white">
                <h1 class="text-2xl font-bold text-center mb-6">Financial Tracker</h1>

                <div class="text-center mb-6">
                    <p class="text-sm opacity-75">Net Balance</p>
                    <h2 class="text-4xl font-bold" id="net-balance">₹0.00</h2>
                </div>

                <div class="flex justify-between gap-4">
                    <div class="bg-white/10 p-4 rounded-lg flex-1 text-center">
                        <p class="text-xs uppercase tracking-wider opacity-75">Income</p>
                        <p class="text-xl font-semibold text-green-400" id="total-income">+₹0.00</p>
                    </div>
                    <div class="bg-white/10 p-4 rounded-lg flex-1 text-center">
                        <p class="text-xs uppercase tracking-wider opacity-75">Expense</p>
                        <p class="text-xl font-semibold text-red-400" id="total-expense">-₹0.00</p>
                    </div>
                </div>
            </div>

            <div class="p-6 border-b border-gray-200">
                <form id="transaction-form" class="space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <input type="text" id="description" placeholder="e.g., Salary, Rent" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none transition">
                    </div>

                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹)</label>
                            <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none transition">
                        </div>
                        <div class="w-1/3">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                            <select id="type"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none bg-white">
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit" id="submit-btn"
                            class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                            Add Entry
                        </button>
                        <button type="button" id="reset-btn"
                            class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg transition duration-200">
                            Reset
                        </button>
                    </div>
                </form>
            </div>

            <div class="p-4 bg-gray-50 flex justify-center gap-6 border-b border-gray-200">
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" name="filter" value="all" checked
                        class="form-radio text-slate-600 focus:ring-slate-500">
                    <span class="ml-2 text-sm font-medium text-gray-700">All</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" name="filter" value="income"
                        class="form-radio text-green-600 focus:ring-green-500">
                    <span class="ml-2 text-sm font-medium text-gray-700">Income</span>
                </label>
                <label class="inline-flex items-center cursor-pointer">
                    <input type="radio" name="filter" value="expense"
                        class="form-radio text-red-600 focus:ring-red-500">
                    <span class="ml-2 text-sm font-medium text-gray-700">Expense</span>
                </label>
            </div>

            <div class="p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Transaction History</h3>
                <ul id="transaction-list" class="transaction-list space-y-3 max-h-64 overflow-y-auto pr-1">
                </ul>
                <div id="empty-state" class="hidden text-center text-gray-400 py-8">
                    No transactions found.
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
